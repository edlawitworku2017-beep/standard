 if(window.LANG==='en'){for(k in EN)d[k]=EN[k];for(k in TRM)if(hasEth(k))d[k]=TRM[k]}
 else{for(k in TRM)if(!hasEth(k))d[k]=TRM[k]}
 var keys=Object.keys(d);ANY=keys.length>0;
 keys.sort(function(a,b){return b.length-a.length});
 keys.forEach(function(k){var c=k.charAt(0),a=IDX.get(c);if(!a){a=[];IDX.set(c,a)}a.push([k,d[k]])})}
function scan(s){var out='',i=0,n=s.length;
 while(i<n){var c=s.charAt(i),cand=IDX.get(c),hit=null;
  if(cand&&(i===0||!isW(s.charCodeAt(i-1)))){for(var q=0;q<cand.length;q++){var k=cand[q][0];if(s.startsWith(k,i)){var j=i+k.length;if(j>=n||!isW(s.charCodeAt(j))){hit=cand[q];break}}}}
  if(hit){out+=hit[1];i+=hit[0].length}else{out+=c;i++}}
 return out}

function skip(e){var t=e.tagName;return t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||(e.hasAttribute&&e.hasAttribute('data-nt'))}
function trNode(r){if(r.nodeType===3){if(r.parentNode&&skip(r.parentNode))return;trTxt(r);return}

 while((n=w.nextNode())){if(n.nodeType===1)trEl(n);else trTxt(n)}}

function g2j(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}

function canonType(v){const k=Object.keys(D.cfg.types).find(t=>eqT(D.cfg.types[t],v));return k?D.cfg.types[k]:v}
function canonAdm(v){const u=ST.users.find(x=>eqT(x.name,v));return u?u.name:v}
function trSources(){const S=new Set(),add=s=>{if(typeof s!=='string')return;s=s.trim();if(s.length<2||s.length>300)return;if(/[\u1200-\u137F]/.test(s)||/[A-Za-z]{3,}/.test(s))S.add(s)};
 add(D.cfg.title);D.cfg.fields.forEach(f=>{add(f.label);(f.opts||[]).forEach(add)});D.cfg.grades.forEach(g=>{add(g.name);add(g.short)});Object.values(D.cfg.types).forEach(add);
 Object.values(D.cl||{}).forEach(t=>(t.cats||[]).forEach(c=>{add(c.title);(c.subs||[]).forEach(x=>{add(x.title);(x.opts||[]).forEach(o=>add(o.t))})}));
 (ST.assocs||[]).forEach(add);(D.prev||[]).forEach(add);(ST.users||[]).forEach(u=>add(u.name));return[...S]}
const TRFAIL=new Set();let atrBusy=false;
async function autoTr(manual){if(atrBusy||!ME||ME.role!=='admin'||navigator.onLine===false)return;atrBusy=true;let added=0,failed=0;
 try{for(let g=0;g<60;g++){const miss=trSources().filter(x=>getTR()[x]===undefined&&!hasStatic(x)&&!TRFAIL.has(x));if(!miss.length)break;
  const r=await api('translate','POST',{list:miss.slice(0,12)},true);(r.fail||[]).forEach(x=>{TRFAIL.add(x);failed++});miss.slice(0,12).forEach(x=>{if(!(r.tr||{})[x]&&!TRFAIL.has(x))TRFAIL.add(x)});
  const n=Object.keys(r.tr||{}).length;if(n)setTR(Object.assign({},getTR(),r.tr));added+=n}}
 catch(e){}finally{atrBusy=false}
 if(added){toast('🌐 '+added+' ትርጉሞች ተጨመሩ');if(V.v==='dash'&&!V.dr)vDash();else if(V.v==='usr')vUsr()}
 else if(failed&&manual)toast('⚠️ የትርጉም አገልግሎት አልሰራም')}
const tabR=()=>{const l=trSources().filter(x=>!hasStatic(x)||getTR()[x]!==undefined);V.trl=l;
 return `<div class="card"><p class="mu">አዲስ ወይም የተስተካከሉ የቼክሊስት፣ የመስክ፣ የማህበር ጽሑፎች ወደ ሌላኛው ቋንቋ በራስ ይተረጎማሉ። ትርጉሙ ካልተስማማዎት እዚህ ያስተካክሉ።</p><div class="row"><button data-a="trauto">🌐 የጎደሉትን በራስ ተርጉም</button><button class="p" data-a="trsave">💾 ትርጉሞችን አስቀምጥ</button></div></div><div class="card"><div class="tw"><table><tr><th>ዋናው ጽሑፍ</th><th>ትርጉም</th></tr>${l.map((x,i)=>`<tr><td data-nt>${esc(x)}</td><td><input data-ti="${i}" value="${esc(getTR()[x]||'')}"></td></tr>`).join('')}</table></div></div>`};
ACT.trauto=()=>run(async()=>{TRFAIL.clear();await autoTr(true);vSet()});
ACT.trsave=()=>run(async()=>{const m={};document.querySelectorAll('input[data-ti]').forEach(i=>{const x=V.trl[+i.dataset.ti],v=i.value.trim();if((getTR()[x]||'')!==v)m[x]=v});if(!Object.keys(m).length)return toast('ምንም የተለወጠ ትርጉም የለም');const r=await api('trset','POST',{map:m});setTR(r.tr);toast('ትርጉሞች ተቀምጠዋል');vSet()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
LANGBOOT();

run(async()=>{render();if(navigator.onLine!==false&&window.VCL_API&&!/PASTE/.test(window.VCL_API))fetch(window.VCL_API).catch(()=>{})});

</script>
</body></html>
